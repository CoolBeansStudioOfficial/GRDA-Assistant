<!DOCTYPE HTML>

<html>
    <head>
        <script type="module" src="js/chatbot.js"></script>
        <script type="module" src="js/elements.js"></script>
        <script type="module" src="js/ui.js"></script>
        <link rel="stylesheet" href="style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="vbox">
            <h1 id="title">GRDA Custodial Support Assistant</h1>
            <div class="vbox chatview" style="gap: 5px;">
                <div id="messages" class="vbox messages"></div>
                <div id="suggestions" class="vbox suggestions"></div>
                <input placeholder="Enter your question here (or type 'all' to see every option)..." spellcheck="true" class="input " id="input" />
            </div>
        </div>
        
    </body>
</html>
